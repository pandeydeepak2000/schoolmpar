<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SchoolMapr</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 24px;
            text-align: center;
        }
        .logo-box {
            width: 88px;
            height: 88px;
            background: #ffffff;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            box-shadow: 0 16px 36px rgba(0,0,0,0.25);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        h1 span { color: #febb02; }
        p {
            font-size: 14px;
            opacity: 0.9;
            max-width: 280px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .loader {
            width: 38px;
            height: 38px;
            border: 3.5px solid rgba(255,255,255,0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .retry-btn {
            display: none;
            background: #ffffff;
            color: #1e3a8a;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            margin-top: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="logo-box">🎓</div>
    <h1>School<span>Mapr</span></h1>
    <p id="status-text">Connecting to SchoolMapr Live Portal...</p>
    <div class="loader" id="loader"></div>
    <button class="retry-btn" id="retry-btn" onclick="retryConnection()">Tap to Retry</button>

    <script>
        const LIVE_URL = 'https://schoolmapr.com';
        function checkAndRedirect() {
            fetch(LIVE_URL, { mode: 'no-cors' })
                .then(() => {
                    window.location.href = LIVE_URL;
                })
                .catch(() => {
                    document.getElementById('status-text').innerText = 'Please check your internet connection.';
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('retry-btn').style.display = 'inline-block';
                });
        }
        function retryConnection() {
            document.getElementById('status-text').innerText = 'Reconnecting...';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('retry-btn').style.display = 'none';
            setTimeout(checkAndRedirect, 800);
        }
        setTimeout(checkAndRedirect, 400);
    </script>
</body>
</html>
