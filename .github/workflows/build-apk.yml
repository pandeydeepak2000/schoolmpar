name: Build SchoolMapr Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'capacitor.config.json'
      - 'mobile-shell/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: |
          npx cap sync android || echo "Sync skipped or completed with warnings, using tracked assets"

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            REASON=$(grep -A 4 -m 1 "What went wrong:" ../gradle.log | tr '\n' ' ' || echo "Gradle build failed")
            echo "::error title=Gradle Root Cause::$REASON"
            echo "===== LAST 100 LINES OF GRADLE LOG ====="
            tail -n 100 ../gradle.log
            exit $EXIT_CODE
          fi

      - name: Upload Gradle Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: gradle.log

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/SchoolMapr-v1.0.apk
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolMapr-Android-APK
          path: build-output/SchoolMapr-v1.0.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "SchoolMapr Android App v1.0"
          body: |
            ### 📱 SchoolMapr Android App (v1.0)
            
            - **App Name:** SchoolMapr
            - **Package ID:** `com.schoolmapr.app`
            - **Live Web Service:** https://schoolmapr.com
            - **Compatible:** Android 7.0 (Nougat) to Android 15 (Vanilla Ice Cream)
            
            #### 📥 Download:
            Download **`SchoolMapr-v1.0.apk`** below directly onto your Android device to install and use the app.
          files: build-output/SchoolMapr-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
